<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FCM 架構與功能分支圖</title>
<style>
:root{color-scheme:dark;--accent:#a56cff;--panel:#17131e;--line:#665778}*{box-sizing:border-box}body{margin:0;background:#0d0b11;color:#f5f1fa;font:14px system-ui}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}aside{padding:22px 14px;background:#121017;border-right:1px solid #352e40}h1{font-size:20px;margin:0 8px 16px}h2{margin:0 0 6px}input{width:100%;padding:10px;background:#0d0b11;border:1px solid #40364c;color:#fff;border-radius:7px}.group{margin:18px 8px 6px;color:#9f96aa;font-size:11px}button{color:#eee;background:transparent;border:0;cursor:pointer}.feature{width:100%;padding:10px;text-align:left;border-radius:7px}.feature:hover,.feature.active{background:#2b2040;color:#d6c0ff}.main{padding:24px;min-width:0}.subtitle{color:#aaa1b4}.tree{margin-top:18px;padding:30px;min-height:560px;background:radial-gradient(circle at 20%,#20172c,#100e15 60%);border:1px solid #352d40;border-radius:12px;overflow:auto}.root,.branch,.file{padding:9px 11px;background:#211b2a;border:1px solid #493d57;border-left:4px solid var(--accent);border-radius:7px}.root{background:#382557}.bundle{display:grid;grid-template-columns:190px 230px minmax(310px,1fr);gap:70px;align-items:center;min-width:900px}.branches{display:grid;gap:16px}.row{display:grid;grid-template-columns:230px minmax(310px,1fr);gap:70px;align-items:center}.files{display:grid;gap:6px}.branch,.file{position:relative;text-align:left}.branch:before,.file:before{content:'';position:absolute;right:100%;top:50%;width:70px;border-top:2px solid var(--line)}.type{display:block;color:var(--accent);font-size:10px}.detail{margin-top:14px;padding:14px;border-left:3px solid var(--accent);background:var(--panel);line-height:1.8}code{color:#d9c8f5}@media(max-width:700px){.app{display:block}.main{padding:15px}}
</style>
</head>
<body>
<div class="app"><aside><h1>FCM 架構與功能分支圖</h1><input id="q" placeholder="搜尋功能或檔案"><nav id="nav"></nav></aside><main class="main"><h2 id="title"></h2><div id="desc" class="subtitle"></div><section id="tree" class="tree"></section><div id="detail" class="detail"></div></main></div>
<script>
const features=[
 ['啟動與公開 API','載入 FCM、組合主要功能並提供穩定的外部整合介面',[['Bootstrap','啟動與組合','main.js,app.js'],['Public API','頭像與 Profiles','api/public-api.js'],['Lifecycle','初始化','core/core-init.js']]],
 ['關係與 Profile','好友關係、人物資料、Profile 快取與頭像快照',[['Data','關係資料','data/data.js,data/profile-cache.js'],['Storage','Profile 與 Snapshot DB','data/profile-db.js'],['Panel','好友與人物頁','panel/panel-friends.js,panel/panel-people.js'],['Action','人物操作','chat/actions.js']]],
 ['房間管理','房內成員、管理權限、房間資料與公開房搜尋',[['Panel','房間與查詢','panel/panel-room.js,panel/panel-roomsearch.js'],['Data','房間查詢資料','panel/panel-rooms-data.js'],['Controller','面板控制與渲染','panel/panel.js,panel/panel-controller.js'],['Shared UI','共用分頁與拖曳捲動','panel/panel-widgets.js,ui/drag-scroll.js']]],
 ['FCM CHAT 組合','聊天主入口與依賴組合；分類 index 僅提供乾淨匯入面',[['Composition','聊天組合根','communication/chat.js'],['Controllers','互動與生命週期','communication/chat/controllers/index.js'],['Services','通訊與領域服務','communication/chat/services/index.js'],['Views','Presenter 與樣式','communication/chat/views/index.js'],['Events','DOM 事件','communication/chat/events/index.js'],['Data','訊息與選取狀態','communication/chat/data/index.js']]],
 ['FCM CHAT 功能','訊息傳輸、歷史載入、匯出、多選、聯絡人與聊天氣球',[['Transport','發送、接收與離線投遞','communication/chat/services/chat-sender.js,communication/chat/services/chat-transport-handler.js,communication/chat/services/chat-offline-delivery.js'],['History','儲存與分頁載入','communication/chat/data/chat-store.js,communication/chat/controllers/chat-history-viewport.js'],['Interaction','訊息選單與多選','communication/chat/events/chat-message-actions.js,communication/chat/controllers/chat-message-selection.js'],['Presentation','對話與聯絡人','communication/chat/views/chat-conversation-presenter.js,communication/chat/services/chat-contact-service.js'],['Feature','匯出與氣球','communication/chat/services/chat-export.js,communication/chat/controllers/chat-balloon.js']]],
 ['分享與相容層','Profile／房間分享、BCX 相容及外部圖片信任',[['Share','WPS Profile 分享','chat/wps-share.js'],['Action','房間與好友分享','chat/actions.js'],['Compat','BCX 相容','communication/bcx-compat.js'],['Trust','圖片來源信任','communication/image-trust.js']]],
 ['介面、設定與語系','面板樣式、共用 UI、主題、圖示和完整多語支援',[['Panel','設定、說明與樣式','panel/panel-settings.js,panel/panel-help.js,panel/styles.js'],['UI','Dialog、圖示與拖曳','ui/dialog.js,ui/icons.js,ui/drag-scroll.js'],['Theme','主題與選擇器','core/themes.js,ui/theme-select.js'],['i18n','翻譯入口與引擎','i18n/i18n.js,i18n/i18n-engine.js,i18n/i18n-fallback.js']]],
 ['核心 Hooks','以 BC 事件更新關係、Profile、房間與聊天狀態',[['Hooks','遊戲事件整合','core/hooks.js'],['Config','設定與版本','core/config.js,core/version.js'],['Chat Runtime','聊天執行期','communication/chat/controllers/chat-runtime.js'],['Presence','狀態更新','communication/chat/services/chat-presence.js']]]
];
let active=features[0];const nav=document.querySelector('#nav'),tree=document.querySelector('#tree'),detail=document.querySelector('#detail'),title=document.querySelector('#title'),desc=document.querySelector('#desc'),query=document.querySelector('#q');
function renderNav(value=''){nav.innerHTML='<div class="group">功能分支</div>';const needle=value.toLowerCase();features.filter(item=>JSON.stringify(item).toLowerCase().includes(needle)).forEach(item=>{const button=document.createElement('button');button.className=`feature ${item===active?'active':''}`;button.textContent=item[0];button.onclick=()=>{active=item;renderNav(value);renderTree()};nav.append(button)})}
function showDetail(name,files){detail.innerHTML=`<b>${name}</b><br>${files.split(',').map(file=>`<code>src/${file}</code>`).join('　')}`}
function renderTree(){title.textContent=active[0];desc.textContent=active[1];tree.innerHTML=`<div class="bundle"><div class="root">${active[0]}</div><div class="branches">${active[2].map(branch=>`<div class="row"><button class="branch" data-files="${branch[2]}"><span class="type">${branch[0]}</span>${branch[1]}</button><div class="files">${branch[2].split(',').map(file=>`<button class="file" data-files="${file}"><span class="type">FILE</span>${file}</button>`).join('')}</div></div>`).join('')}</div></div>`;tree.querySelectorAll('button').forEach(button=>button.onclick=()=>showDetail(button.textContent,button.dataset.files));showDetail(active[0],active[2].flatMap(branch=>branch[2].split(',')).join(','))}
query.oninput=()=>renderNav(query.value);renderNav();renderTree();
</script>
</body>
</html>
