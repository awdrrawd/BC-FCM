<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>FCM-Chat — UI Style Preview (4 themes × independent corner style, mock data)</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0; min-height: 100vh; background: #05070a;
        font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
        display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 24px;
    }
    #tool-note { color: #7d879e; font-size: 12px; max-width: 780px; line-height: 1.6; }
    #tool-note b { color: #cda85a; }
    .tool-row { display: flex; gap: 8px; align-items: center; }
    .tool-row .tool-label { color: #566072; font-size: 11px; margin-right: 4px; }
    .tool-row button {
        padding: 7px 16px; border-radius: 4px; border: 1px solid #33404f; background: #12161f; color: #c7cfdd;
        font-size: 12px; cursor: pointer; letter-spacing: .03em;
    }
    .tool-row button.active { border-color: #cda85a; color: #cda85a; background: #1c1710; }

    /* =====================================================================
       TOKEN GROUPS — colour / font / decoration only. NO widths, heights,
       paddings, gaps or border-radius live in here — those are fixed in the
       component CSS below so switching themes never reflows anything.
       Corner style (rounded vs sharp) lives inside each theme block below —
       it's part of that theme's identity, not a separate knob. See
       EuroLink-theme-tokens.md.
       ===================================================================== */
    [data-theme="eu"] {
        --c-surface: #171d29; --c-surface-alt: #1e2636; --c-surface-raised: #262f44; --c-surface-selected: #303a54;
        --c-text: #f2efe6; --c-text-dim: #aab2c9; --c-text-inverse: #171d29;
        --c-border: #2f3a52; --c-border-strong: #cda85a;
        --c-accent: #cda85a; --c-accent-soft: rgba(205,168,90,0.16);
        --c-online: #6fbf8b; --c-busy: #c1543f; --c-idle: #d99a52; --c-offline: #5b6478;
        --c-whisper: #7fa9d6; --c-beep: #b9a6cf;
        --c-danger: #c1543f;
        --f-display: 'Cormorant Garamond', Georgia, 'Palatino Linotype', serif;
        --f-body: -apple-system, 'Segoe UI', Roboto, sans-serif;
        --deco-accent-2: transparent;
        --radius-panel: 6px; --radius-control: 4px;
    }
    [data-theme="electronic"] {
        --c-surface: #0b0f14; --c-surface-alt: #10161d; --c-surface-raised: #16202b; --c-surface-selected: #17324a;
        --c-text: #d9f8ff; --c-text-dim: #6f8a99; --c-text-inverse: #04120f;
        --c-border: #1c2a33; --c-border-strong: #35e0c9;
        --c-accent: #35e0c9; --c-accent-soft: rgba(53,224,201,0.14);
        --c-online: #35e0c9; --c-busy: #ff3d5a; --c-idle: #ffd23d; --c-offline: #45525c;
        --c-whisper: #4fb2ff; --c-beep: #c792ff;
        --c-danger: #ff3d5a;
        --f-display: 'Orbitron', 'Segoe UI Semibold', -apple-system, sans-serif;
        --f-body: 'Consolas', 'SFMono-Regular', 'Segoe UI', monospace;
        --deco-accent-2: #ff3d9a;
        --radius-panel: 2px; --radius-control: 2px;
    }
    [data-theme="jp"] {
        --c-surface: #f7f3ea; --c-surface-alt: #efe8d8; --c-surface-raised: #e6ddc8; --c-surface-selected: #ded1b2;
        --c-text: #2b2a28; --c-text-dim: #7a7266; --c-text-inverse: #f7f3ea;
        --c-border: #d8cdb3; --c-border-strong: #3a3733;
        --c-accent: #b23b32; --c-accent-soft: rgba(178,59,50,0.12);
        --c-online: #4d7c6f; --c-busy: #b23b32; --c-idle: #c98a3a; --c-offline: #a39c8c;
        --c-whisper: #4d6a91; --c-beep: #8a6fa3;
        --c-danger: #b23b32;
        --f-display: '游明朝', 'Yu Mincho', 'Hiragino Mincho ProN', serif;
        --f-body: '游ゴシック', 'Yu Gothic', -apple-system, sans-serif;
        --deco-accent-2: #4d6a91;
        --radius-panel: 2px; --radius-control: 2px;
    }
    [data-theme="cn"] {
        --c-surface: #1a1210; --c-surface-alt: #241a17; --c-surface-raised: #2e211d; --c-surface-selected: #3a2620;
        --c-text: #f2e6d8; --c-text-dim: #b8a58f; --c-text-inverse: #1a1210;
        --c-border: #4a332b; --c-border-strong: #d4a017;
        --c-accent: #c23616; --c-accent-soft: rgba(194,54,22,0.16);
        --c-online: #4e8c5c; --c-busy: #c23616; --c-idle: #d4a017; --c-offline: #6b5c52;
        --c-whisper: #3f6f91; --c-beep: #7a5a8c;
        --c-danger: #c23616;
        --f-display: '標楷體', 'DFKai-SB', 'KaiTi', serif;
        --f-body: '微軟正黑體', 'Microsoft JhengHei', -apple-system, sans-serif;
        --deco-accent-2: #d4a017;
        --radius-panel: 2px; --radius-control: 2px;
    }
    /* E — 耀紫 Radiant Violet: brand accent 7648fe, built as a modern fashion-tech dark theme
       around it (soft rounded geometry, geometric sans display font — deliberately NOT serif,
       to read as "current" rather than "classical" like the EU theme). */
    [data-theme="violet"] {
        --c-surface: #1A1821; --c-surface-alt: #13101a; --c-surface-raised: #322744; --c-surface-selected: #2c2140;
        --c-text: #f1ecff; --c-text-dim: #9c93b8; --c-text-inverse: #1A1821;
        --c-border: #2a2338; --c-border-strong: #7648fe;
        --c-accent: #7648fe; --c-accent-soft: rgba(118,72,254,0.18);
        --c-online: #4fe0a0; --c-busy: #ff4f81; --c-idle: #ffb347; --c-offline: #5c5570;
        --c-whisper: #5ab4ff; --c-beep: #c792ff;
        --c-danger: #ff4f4f;
        --f-display: 'Poppins', 'Century Gothic', -apple-system, sans-serif;
        --f-body: -apple-system, 'Segoe UI', Roboto, sans-serif;
        --deco-accent-2: #ff4f9e;
        --radius-panel: 10px; --radius-control: 6px;
    }
    /* F — 寂靜黑 Silent Black: near-monochrome high-fashion black. The "accent" is a quiet
       light grey, not a saturated colour — loud colour would break the "silent" premise.
       Status colours stay, muted, since they're functional, not decorative. Sharp corners. */
    [data-theme="silentblack"] {
        --c-surface: #0a0a0a; --c-surface-alt: #121212; --c-surface-raised: #1c1c1c; --c-surface-selected: #262626;
        --c-text: #ededed; --c-text-dim: #7a7a7a; --c-text-inverse: #0a0a0a;
        --c-border: #232323; --c-border-strong: #d8d8d8;
        --c-accent: #d8d8d8; --c-accent-soft: rgba(216,216,216,0.10);
        --c-online: #6fbf8b; --c-busy: #b5533f; --c-idle: #c9a24e; --c-offline: #4a4a4a;
        --c-whisper: #6f8fae; --c-beep: #8f7fae;
        --c-danger: #b5533f;
        --f-display: 'Helvetica Neue', 'Futura', -apple-system, sans-serif;
        --f-body: -apple-system, 'Segoe UI', Roboto, sans-serif;
        --deco-accent-2: transparent;
        --radius-panel: 0px; --radius-control: 0px;
    }
    /* G — 極簡白 Minimal White: inverse pairing to Silent Black — same monochrome restraint
       and font family, but soft rounded corners instead of sharp (airy/soft vs severe/sharp). */
    [data-theme="minimalwhite"] {
        --c-surface: #fafafa; --c-surface-alt: #f2f2f2; --c-surface-raised: #ececec; --c-surface-selected: #e2e2e2;
        --c-text: #171717; --c-text-dim: #8a8a8a; --c-text-inverse: #fafafa;
        --c-border: #e0e0e0; --c-border-strong: #171717;
        --c-accent: #171717; --c-accent-soft: rgba(23,23,23,0.06);
        --c-online: #4a9d6e; --c-busy: #c14f3a; --c-idle: #c99a3a; --c-offline: #b5b5b5;
        --c-whisper: #4a6f9d; --c-beep: #7a5a9d;
        --c-danger: #c14f3a;
        --f-display: 'Helvetica Neue', 'Futura', -apple-system, sans-serif;
        --f-body: -apple-system, 'Segoe UI', Roboto, sans-serif;
        --deco-accent-2: transparent;
        --radius-panel: 10px; --radius-control: 6px;
    }

    /* =====================================================================
       LAYOUT — fixed geometry, identical for every theme. Region sizes,
       paddings, gaps and font-sizes are all plain px here, never tokens.
       ===================================================================== */
    #fcm-panel {
        width: 780px; height: 500px; display: flex; flex-direction: column;
        background: var(--c-surface); color: var(--c-text); font-family: var(--f-body);
        border: 1px solid var(--c-border-strong); border-radius: var(--radius-panel);
        box-shadow: 0 12px 40px rgba(0,0,0,0.5); overflow: hidden; position: relative;
        transition: width .32s cubic-bezier(.4,0,.2,1), height .32s cubic-bezier(.4,0,.2,1);
    }
    #fcm-panel.maximized { width: 96vw; height: 88vh; }
    #fcm-titlebar .fcm-tbtn#btn-maximize svg { transition: transform .32s cubic-bezier(.4,0,.2,1); }
    #fcm-panel.maximized #fcm-titlebar .fcm-tbtn#btn-maximize svg { transform: rotate(180deg); }

    /* region A */
    #fcm-titlebar {
        flex-shrink: 0; height: 38px; display: flex; align-items: center; justify-content: space-between;
        padding: 0 12px; background: var(--c-surface-alt); border-bottom: 1px solid var(--c-border); cursor: move;
        position: relative;
    }
    #fcm-titlebar::after {
        /* universal titlebar underline flourish — every theme gets this, only colour differs */
        content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px;
        background: linear-gradient(90deg, transparent, var(--c-accent) 15%, var(--c-accent) 85%, transparent);
        opacity: .75;
    }
    #fcm-titlebar .fcm-title { font-family: var(--f-display); font-size: 16px; color: var(--c-accent); letter-spacing: .03em; }
    #fcm-titlebar .fcm-title-btns { display: flex; align-items: center; gap: 6px; }
    #fcm-titlebar .fcm-tbtn {
        position: relative; width: 22px; height: 22px; border-radius: var(--radius-control);
        border: 1px solid transparent; background: transparent; color: var(--c-text-dim); cursor: pointer;
        display: flex; align-items: center; justify-content: center; font-size: 12px; padding: 0;
        flex-shrink: 0;
        transition: background-color .15s ease, border-color .15s ease, color .15s ease, transform .1s ease;
    }
    #fcm-titlebar .fcm-tbtn svg { width: 13px; height: 13px; flex-shrink: 0; }
    /* the "收放" (collapse/expand) sliding bit: a label pill slides open BELOW the button on
       hover/focus. It's absolutely positioned and pointer-events:none, so — unlike an
       inline width-expand — it never resizes the button itself or pushes its neighbours.
       That was the source of the toolbar bug: an expanding-width button shoves the next
       button out from under the cursor mid-hover, so clicks miss and the row can look
       "stuck" mid-transition. A slide-down tooltip gets the same open/close motion with a
       fixed-size, always-in-place hit target. */
    #fcm-titlebar .fcm-tbtn-label {
        position: absolute; top: calc(100% + 6px); right: 0;
        background: var(--c-surface-raised); color: var(--c-text); border: 1px solid var(--c-border-strong);
        border-radius: var(--radius-control); padding: 3px 8px; font-size: 10.5px; white-space: nowrap;
        box-shadow: 0 6px 16px rgba(0,0,0,.35);
        opacity: 0; max-height: 0; overflow: hidden; pointer-events: none; z-index: 20;
        transform: translateY(-4px);
        transition: opacity .18s ease, transform .22s cubic-bezier(.4,0,.2,1), max-height .22s cubic-bezier(.4,0,.2,1);
    }
    #fcm-titlebar .fcm-tbtn:hover, #fcm-titlebar .fcm-tbtn:focus-visible, #fcm-titlebar .fcm-tbtn.active {
        background: var(--c-accent-soft); border-color: var(--c-accent); color: var(--c-accent);
    }
    #fcm-titlebar .fcm-tbtn:hover .fcm-tbtn-label,
    #fcm-titlebar .fcm-tbtn:focus-visible .fcm-tbtn-label {
        opacity: 1; max-height: 22px; transform: translateY(0);
    }

    #fcm-body { flex: 1; display: flex; min-height: 0; position: relative; overflow: hidden; }
    /* Stacked (mobile-narrow) mode: C and D become two full-width "pages" that slide past
       each other — this is the collapse/expand slide the layout (fcm-tbtn) toggle drives.
       IMPORTANT: transform alone can leave a visible/clickable sliver of the "hidden" page
       (edge rounding, compositing-layer quirks) which is exactly what blocked the toolbar —
       so the page that's off-screen also gets visibility:hidden + pointer-events:none, timed
       to kick in only *after* the slide-out finishes (transition-delay = slide duration) so
       the slide animation itself still plays, but once settled it is truly gone: unclickable
       and unpaintable, not just visually offset. */
    #fcm-body.stacked-mode #fcm-list,
    #fcm-body.stacked-mode #fcm-conv {
        position: absolute; top: 0; bottom: 0; left: 54px; width: calc(100% - 54px);
        visibility: visible; pointer-events: auto;
        transition: transform .32s cubic-bezier(.4,0,.2,1), visibility 0s linear 0s, pointer-events 0s linear 0s;
    }
    #fcm-body.stacked-mode #fcm-list { transform: translateX(0); z-index: 2; }
    #fcm-body.stacked-mode #fcm-list.fcm-slide-off {
        transform: translateX(-100%); visibility: hidden; pointer-events: none;
        transition: transform .32s cubic-bezier(.4,0,.2,1), visibility 0s linear .32s, pointer-events 0s linear .32s;
    }
    #fcm-body.stacked-mode #fcm-conv { transform: translateX(100%); z-index: 3; visibility: hidden; pointer-events: none;
        transition: transform .32s cubic-bezier(.4,0,.2,1), visibility 0s linear .32s, pointer-events 0s linear .32s;
    }
    #fcm-body.stacked-mode #fcm-conv.fcm-slide-in {
        transform: translateX(0); visibility: visible; pointer-events: auto;
        transition: transform .32s cubic-bezier(.4,0,.2,1), visibility 0s linear 0s, pointer-events 0s linear 0s;
    }

    /* region B */
    #fcm-rail {
        width: 54px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center;
        padding: 10px 0; gap: 6px; background: var(--c-surface-alt); border-right: 1px solid var(--c-border);
        /* Stacked-mode's #fcm-list / #fcm-conv slide with position:absolute + z-index:2/3, and
           their translateX sweep passes directly over this rail's 0–54px strip mid-animation.
           The rail itself had no z-index, so during that sweep it briefly sat *behind* the
           sliding panel and got painted over. Giving it a stacking context with a z-index above
           both sliding panels means it always renders on top, independent of animation timing —
           no need to time a hide/show around the .32s transition. */
        position: relative; z-index: 5;
    }
    #fcm-rail .fcm-self-avatar {
        width: 36px; height: 36px; border-radius: 50%; overflow: hidden; cursor: pointer;
        border: 2px solid var(--c-border); display: flex; align-items: center; justify-content: center;
        font-family: var(--f-display); color: var(--c-accent); background: var(--c-surface); margin-bottom: 6px;
    }
    #fcm-rail .fcm-self-avatar.active { border-color: var(--c-accent); }
    #fcm-rail .fcm-icon {
        width: 36px; height: 36px; border-radius: var(--radius-control);
        border: 1px solid transparent; /* reserved so active/hover never shifts size */
        display: flex; align-items: center; justify-content: center;
        cursor: pointer; color: var(--c-text-dim); position: relative;
    }
    #fcm-rail .fcm-icon:hover { background: var(--c-surface-raised); color: var(--c-text); }
    #fcm-rail .fcm-icon.active { background: var(--c-accent-soft); border-color: var(--c-accent); color: var(--c-accent); }
    #fcm-rail .fcm-icon svg { width: 18px; height: 18px; }
    #fcm-rail .fcm-spacer { flex: 1; }
    #fcm-rail .fcm-status-dot {
        position: absolute; bottom: 2px; right: 2px; width: 8px; height: 8px; border-radius: 50%;
        border: 2px solid var(--c-surface-alt);
    }

    /* region C */
    #fcm-list {
        width: 250px; flex-shrink: 0; display: flex; flex-direction: column;
        border-right: 1px solid var(--c-border); overflow: hidden;
    }
    #fcm-list.wide { width: 100%; border-right: none; }
    .fcm-list-header { padding: 10px 12px 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--c-text-dim); flex-shrink: 0; }
    .fcm-subtabs { display: flex; padding: 0 10px; gap: 4px; flex-shrink: 0; border-bottom: 1px solid var(--c-border); }
    .fcm-subtab { flex: 1; text-align: center; padding: 6px 0; font-size: 11.5px; color: var(--c-text-dim); cursor: pointer; border-bottom: 2px solid transparent; }
    .fcm-subtab:hover { color: var(--c-text); }
    .fcm-subtab.active { color: var(--c-accent); border-bottom-color: var(--c-accent); }
    .fcm-search-wrap { padding: 8px 10px; flex-shrink: 0; }
    .fcm-search { width: 100%; box-sizing: border-box; padding: 6px 8px; border-radius: var(--radius-control); border: 1px solid var(--c-border); background: var(--c-surface-alt); color: var(--c-text); font-family: var(--f-body); font-size: 12px; }
    .fcm-search::placeholder { color: var(--c-text-dim); }
    .fcm-search:focus { outline: none; border-color: var(--c-accent); }
    .fcm-tags { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 10px 8px; flex-shrink: 0; }
    .fcm-tag { padding: 3px 9px; border-radius: 12px; border: 1px solid var(--c-border); font-size: 11px; color: var(--c-text-dim); cursor: pointer; }
    .fcm-tag:hover { border-color: var(--c-accent); color: var(--c-text); }
    .fcm-tag.active { background: var(--c-accent-soft); border-color: var(--c-accent); color: var(--c-accent); }
    .fcm-tag-sep { width: 1px; align-self: stretch; background: var(--c-border); margin: 2px 2px; }
    .fcm-toolbar-row { display: flex; align-items: center; gap: 6px; padding: 0 10px 8px; flex-shrink: 0; }
    .fcm-mini-btn { font-size: 10.5px; color: var(--c-text-dim); cursor: pointer; padding: 2px 6px; border: 1px solid var(--c-border); border-radius: var(--radius-control); }
    .fcm-mini-btn:hover { color: var(--c-text); }
    .fcm-mini-btn.active { color: var(--c-accent); border-color: var(--c-accent); background: var(--c-accent-soft); }
    .fcm-scroll { flex: 1; overflow-y: auto; padding: 2px 6px 6px; }
    .fcm-empty { padding: 20px 14px; color: var(--c-text-dim); font-size: 12px; font-style: italic; text-align: center; }

    .fcm-row { display: flex; align-items: center; gap: 8px; padding: 7px 6px; border-radius: var(--radius-control); border: 1px solid transparent; cursor: pointer; }
    .fcm-row:hover { background: var(--c-surface-raised); }
    .fcm-row.selected { background: var(--c-surface-selected); border-color: var(--c-border); }
    .fcm-row.just-opened { animation: fcm-row-pop .32s cubic-bezier(.4,0,.2,1); }
    @keyframes fcm-row-pop { 0% { transform: scale(1); } 40% { transform: scale(.965); background: var(--c-accent-soft); } 100% { transform: scale(1); } }
    .fcm-avatar { width: 32px; height: 32px; border-radius: 50%; overflow: hidden; flex-shrink: 0; background: var(--c-surface-alt); display: flex; align-items: center; justify-content: center; font-family: var(--f-display); font-size: 11px; color: var(--c-accent); border: 1px solid var(--c-border); position: relative; }
    .fcm-avatar .fcm-presence { position: absolute; bottom: -1px; right: -1px; width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--c-surface); }
    .fcm-row-meta { flex: 1; min-width: 0; }
    .fcm-row-name { font-size: 12.5px; color: var(--c-text); display: flex; align-items: center; gap: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fcm-row-sub { font-size: 11px; color: var(--c-text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fcm-row-time { font-size: 10px; color: var(--c-text-dim); flex-shrink: 0; }
    .fcm-cap-pill { padding: 1px 5px; border-radius: 7px; font-size: 9px; flex-shrink: 0; border: 1px solid transparent; }

    /* region D */
    #fcm-conv { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    /* Interaction animation for "tapping a player opens the chat": header, messages and the
       action/input bars each fade + rise in, messages staggered so they read as populating
       one after another rather than popping in all at once. */
    @keyframes fcm-conv-rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    #fcm-conv-header { animation: fcm-conv-rise .3s cubic-bezier(.2,.8,.2,1) both; }
    #fcm-conv-actions { animation: fcm-conv-rise .3s cubic-bezier(.2,.8,.2,1) both .06s; }
    #fcm-conv-input-row { animation: fcm-conv-rise .3s cubic-bezier(.2,.8,.2,1) both .1s; }
    .fcm-msg { animation: fcm-conv-rise .32s cubic-bezier(.2,.8,.2,1) both; }
    .fcm-msg:nth-of-type(1) { animation-delay: .02s; }
    .fcm-msg:nth-of-type(2) { animation-delay: .07s; }
    .fcm-msg:nth-of-type(3) { animation-delay: .12s; }
    .fcm-msg:nth-of-type(4) { animation-delay: .17s; }
    .fcm-msg:nth-of-type(5) { animation-delay: .22s; }
    .fcm-msg:nth-of-type(n+6) { animation-delay: .26s; }
    .fcm-conv-empty { animation: fcm-conv-rise .3s cubic-bezier(.2,.8,.2,1) both; }
    #fcm-conv-header { padding: 10px 14px; border-bottom: 1px solid var(--c-border); display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    #fcm-conv-header .fcm-back-btn {
        width: 22px; height: 22px; border-radius: var(--radius-control); border: 1px solid transparent;
        background: transparent; color: var(--c-text-dim); cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    #fcm-conv-header .fcm-back-btn:hover { background: var(--c-accent-soft); border-color: var(--c-accent); color: var(--c-accent); }
    #fcm-conv-header .fcm-conv-name { font-family: var(--f-display); font-size: 15px; color: var(--c-accent); }
    #fcm-conv-header .fcm-conv-room { font-size: 11px; color: var(--c-text-dim); margin-left: auto; font-style: italic; }
    #fcm-conv-body { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
    .fcm-msg { max-width: 70%; padding: 6px 10px; border-radius: var(--radius-control); font-size: 12.5px; line-height: 1.4; border: 1px solid transparent; }
    .fcm-msg.in { align-self: flex-start; background: var(--c-surface-alt); color: var(--c-text); }
    .fcm-msg.out { align-self: flex-end; background: var(--c-accent-soft); color: var(--c-text); border-color: var(--c-accent); }
    .fcm-msg .fcm-msg-time { display: block; margin-top: 3px; font-size: 9.5px; color: var(--c-text-dim); }
    #fcm-conv-actions { display: flex; gap: 6px; padding: 6px 12px; border-top: 1px solid var(--c-border); flex-shrink: 0; }
    #fcm-conv-actions .fcm-action-btn { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--c-text-dim); padding: 4px 8px; border: 1px solid var(--c-border); border-radius: var(--radius-control); cursor: pointer; }
    #fcm-conv-actions .fcm-action-btn:hover { color: var(--c-accent); border-color: var(--c-accent); background: var(--c-accent-soft); }
    #fcm-conv-input-row { display: flex; gap: 8px; padding: 10px 12px; flex-shrink: 0; }
    #fcm-conv-input-row textarea { flex: 1; resize: none; padding: 8px; border-radius: var(--radius-control); border: 1px solid var(--c-border); background: var(--c-surface-alt); color: var(--c-text); font-family: var(--f-body); font-size: 12px; }
    #fcm-conv-input-row textarea:focus { outline: none; border-color: var(--c-accent); }
    #fcm-conv-input-row button { padding: 0 16px; border-radius: var(--radius-control); border: 1px solid var(--c-accent); background: var(--c-accent-soft); color: var(--c-accent); cursor: pointer; font-size: 12px; }
    .fcm-conv-empty { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--c-text-dim); font-size: 12px; font-style: italic; }

    /* status popover */
    #fcm-status-menu {
        position: absolute; left: 58px; z-index: 10; background: var(--c-surface); border: 1px solid var(--c-border-strong);
        border-radius: var(--radius-control); box-shadow: 0 6px 20px rgba(0,0,0,0.4); padding: 4px; display: none;
    }
    #fcm-status-menu.open { display: block; }
    #fcm-status-menu .fcm-status-opt { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: var(--radius-control); border: 1px solid transparent; font-size: 12px; color: var(--c-text); cursor: pointer; white-space: nowrap; }
    #fcm-status-menu .fcm-status-opt:hover { background: var(--c-accent-soft); border-color: var(--c-accent); }
    #fcm-status-menu .fcm-status-opt .dot { width: 8px; height: 8px; border-radius: 50%; }

    /* profile editor (own avatar → spans C+D) */
    #fcm-profile { flex: 1; display: flex; flex-direction: column; padding: 24px 40px; overflow-y: auto; }
    #fcm-profile .fcm-profile-row { display: flex; gap: 24px; align-items: flex-start; margin-bottom: 18px; }
    #fcm-profile .fcm-profile-avatar { width: 88px; height: 88px; border-radius: 50%; border: 2px solid var(--c-border-strong); background: var(--c-surface-alt); display: flex; align-items: center; justify-content: center; font-family: var(--f-display); font-size: 26px; color: var(--c-accent); flex-shrink: 0; }
    #fcm-profile .fcm-field { margin-bottom: 14px; max-width: 420px; }
    #fcm-profile label { display: block; font-size: 11px; color: var(--c-text-dim); margin-bottom: 4px; letter-spacing: .03em; }
    #fcm-profile input, #fcm-profile textarea { width: 100%; box-sizing: border-box; padding: 7px 9px; border-radius: var(--radius-control); border: 1px solid var(--c-border); background: var(--c-surface-alt); color: var(--c-text); font-family: var(--f-body); font-size: 12.5px; }
    #fcm-profile input:focus, #fcm-profile textarea:focus { outline: none; border-color: var(--c-accent); }
    #fcm-profile .fcm-avatar-source { display: flex; gap: 8px; }
    #fcm-profile .fcm-avatar-source button { padding: 5px 12px; border-radius: var(--radius-control); border: 1px solid var(--c-border); background: transparent; color: var(--c-text-dim); font-size: 11.5px; cursor: pointer; }
    #fcm-profile .fcm-avatar-source button.active { border-color: var(--c-accent); color: var(--c-accent); background: var(--c-accent-soft); }
    #fcm-profile .fcm-status-row { display: flex; gap: 8px; }
    #fcm-profile .fcm-status-choice { display: flex; align-items: center; gap: 6px; padding: 5px 10px; border: 1px solid var(--c-border); border-radius: var(--radius-control); font-size: 11.5px; color: var(--c-text-dim); cursor: pointer; }
    #fcm-profile .fcm-status-choice.active { border-color: var(--c-accent); color: var(--c-accent); background: var(--c-accent-soft); }
    #fcm-profile .fcm-status-choice .dot { width: 7px; height: 7px; border-radius: 50%; }

    /* ============================ interaction feedback — shared by every theme, every
       clickable element. Only the maximize button had a transition before; this brings the
       rest up to the same standard: smooth colour/border/shadow transitions on every state
       change, plus a small "press" scale-down on :active for tactile feedback. ============ */
    #fcm-titlebar .fcm-tbtn,
    #fcm-rail .fcm-icon,
    #fcm-rail .fcm-self-avatar,
    .fcm-subtab,
    .fcm-search,
    .fcm-tag,
    .fcm-mini-btn,
    .fcm-row,
    #fcm-conv-header .fcm-back-btn,
    #fcm-conv-actions .fcm-action-btn,
    #fcm-conv-input-row textarea,
    #fcm-conv-input-row button,
    #fcm-status-menu .fcm-status-opt,
    #fcm-profile .fcm-avatar-source button,
    #fcm-profile .fcm-status-choice {
        transition: background-color .15s ease, border-color .15s ease, color .15s ease,
                    transform .1s ease, box-shadow .15s ease;
    }
    #fcm-titlebar .fcm-tbtn:active,
    #fcm-rail .fcm-icon:active,
    #fcm-rail .fcm-self-avatar:active,
    .fcm-tag:active,
    .fcm-mini-btn:active,
    .fcm-row:active,
    #fcm-conv-header .fcm-back-btn:active,
    #fcm-conv-actions .fcm-action-btn:active,
    #fcm-conv-input-row button:not(:disabled):active,
    #fcm-status-menu .fcm-status-opt:active,
    #fcm-profile .fcm-avatar-source button:active,
    #fcm-profile .fcm-status-choice:active {
        transform: scale(0.95);
    }
    #fcm-rail .fcm-icon:hover, #fcm-rail .fcm-self-avatar:hover { transform: translateY(-1px); }
    #fcm-status-menu.open { animation: fcm-pop-in .12s ease; }
    @keyframes fcm-pop-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

    /* ---- theme-specific EXTRA flourishes only — never replace the shared baseline above,
       only add on top of it (texture / outer glow / small emblem) ---- */
    [data-theme="electronic"] #fcm-panel { box-shadow: 0 0 0 1px rgba(53,224,201,.25), 0 12px 40px rgba(0,0,0,.6); }
    [data-theme="electronic"] #fcm-panel::before {
        content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .05; z-index: 5;
        background: repeating-linear-gradient(180deg, #fff 0 1px, transparent 1px 3px);
    }
    [data-theme="cn"] #fcm-panel { box-shadow: 0 0 0 3px #0b0605, 0 0 0 4px var(--c-border-strong), 0 12px 40px rgba(0,0,0,.6); }
    [data-theme="jp"] #fcm-panel { background-image: radial-gradient(circle at 15% 10%, rgba(178,59,50,0.035), transparent 40%); }
    /* title text stays plain "FCM-Chat" in every theme — no per-theme glyph/icon prefix */
</style>
</head>
<body>
<div id="tool-note">
    <b>FCM-Chat 風格預覽</b> — 純視覺 mock，不含遊戲邏輯。七個主題只換色彩/字體/圓角，版面尺寸永遠不變；
    圓角/銳角這次收回去跟著主題走，不再是獨立開關。「分類」按鈕模擬手機窄版（ABC ⇄ ABD 切換），「全版」是獨立的最大化開關。
</div>
<div class="tool-row">
    <span class="tool-label">主題</span>
    <button data-theme-btn="eu" class="active">A 歐式</button>
    <button data-theme-btn="electronic">B 電子風</button>
    <button data-theme-btn="jp">C 日式</button>
    <button data-theme-btn="cn">D 中式</button>
    <button data-theme-btn="violet">E 耀紫</button>
    <button data-theme-btn="silentblack">F 寂靜黑</button>
    <button data-theme-btn="minimalwhite">G 極簡白</button>
</div>

<div data-theme="eu" id="fcm-panel">
    <div id="fcm-titlebar">
        <div class="fcm-title">FCM-Chat</div>
        <div class="fcm-title-btns">
            <button class="fcm-tbtn" id="btn-layout" title="Split / stacked layout (mobile preview)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="8" height="16"/><rect x="13" y="4" width="8" height="16"/></svg>
                <span class="fcm-tbtn-label" id="btn-layout-label">分版</span>
            </button>
            <button class="fcm-tbtn" id="btn-maximize" title="Maximize">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
                <span class="fcm-tbtn-label" id="btn-maximize-label">全版</span>
            </button>
            <button class="fcm-tbtn" id="btn-close" title="Close">
                <span style="line-height:1;">×</span><span class="fcm-tbtn-label">關閉</span>
            </button>
        </div>
    </div>
    <div id="fcm-body">
        <div id="fcm-rail">
            <div class="fcm-self-avatar" id="rail-avatar" title="Your profile">Me</div>
            <div class="fcm-icon" data-icon="notifications" title="Notifications">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3a5 5 0 0 0-5 5v3.6c0 .7-.3 1.4-.8 1.9L5 15h14l-1.2-1.5c-.5-.5-.8-1.2-.8-1.9V8a5 5 0 0 0-5-5z"/><path d="M9.5 18a2.5 2.5 0 0 0 5 0"/></svg>
            </div>
            <div class="fcm-icon active" data-icon="chat" title="Chat">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 4h16v12H8l-4 4V4z"/></svg>
            </div>
            <div class="fcm-icon" data-icon="groups" title="Quick groups">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="3"/><circle cx="16" cy="9" r="2.6"/><path d="M3 19c0-3 2.5-5 5-5s5 2 5 5"/><path d="M13.5 14.2c2 .3 3.5 2 3.5 4.8"/></svg>
            </div>
            <div class="fcm-spacer"></div>
            <div class="fcm-icon" data-icon="status" title="Status" style="position:relative;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8"/></svg>
                <div class="fcm-status-dot" id="rail-status-dot"></div>
            </div>
            <div class="fcm-icon" data-icon="settings" title="Settings">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"/></svg>
            </div>
        </div>

        <div id="fcm-list"></div>
        <div id="fcm-conv"></div>
        <div id="fcm-profile" style="display:none;"></div>
    </div>

    <div id="fcm-status-menu"></div>
</div>

<script>
    // ============================ mock data ============================
    const me = { name: 'You', signature: 'testing the new panel', avatarMode: 'custom', avatarUrl: '' };
    const STATUS = [
        { key: 'online', label: 'Online' }, { key: 'busy', label: 'Busy' },
        { key: 'idle', label: 'Idle' }, { key: 'offline', label: 'Offline' },
    ];
    let myStatus = 'online';

    const contacts = [
        { id: 1, name: 'Isolde', room: 'The Rose Garden', cap: 'whisper', presence: 'online', tags: ['owner'],
          last: { dir: 'in', text: 'Good morning ❀', time: '09:12' } },
        { id: 2, name: 'Renard', room: null, cap: 'beep', presence: 'online', tags: [],
          last: { dir: 'out', text: 'Hey, you around?', time: '08:47' } },
        { id: 3, name: 'Mira', room: 'The Rose Garden', cap: 'whisper', presence: 'busy', tags: ['play'],
          last: { dir: 'in', text: 'brb, in a scene', time: '08:30' } },
        { id: 4, name: '雪莉', room: null, cap: 'beep', presence: 'idle', tags: ['play'],
          last: { dir: 'in', text: '晚點聊', time: 'yesterday' } },
        { id: 5, name: 'Corvin', room: null, cap: 'beep', presence: 'online', tags: ['owner', 'follow'],
          last: { dir: 'out', text: 'See you tonight', time: 'yesterday' } },
        { id: 6, name: 'Thistle', room: null, cap: 'none', presence: 'offline', tags: ['sub'],
          last: { dir: 'in', text: 'thank you~', time: '2d ago' } },
        { id: 7, name: 'Wren', room: null, cap: 'none', presence: 'offline', tags: [],
          last: { dir: 'in', text: 'talk later', time: '3d ago' } },
    ];
    const tagDefs = [
        { key: 'owner', label: '主人與戀人' }, { key: 'sub', label: '奴隸' }, { key: 'follow', label: '關注' },
    ];
    const OFFLINE_TAG = { key: 'offline', label: '未上線' };
    const historyLog = [
        { contactId: 1, text: 'Good morning ❀', time: '09:12' },
        { contactId: 4, text: '早安喔', time: '08:55' },
        { contactId: 3, text: 'brb, in a scene', time: '08:30' },
        { contactId: 5, text: 'Almost ready', time: '07:58' },
        { contactId: 1, text: 'Sleep well?', time: '07:40' },
        { contactId: 6, text: 'thank you~', time: '2d ago' },
    ];
    const quickGroups = [
        { id: 'room', label: '房間 (built-in)', builtin: true, members: contacts.filter(c => c.room) },
        { id: 'g1', label: 'Weekend crew', builtin: false, members: [contacts[1], contacts[3]] },
    ];
    const capLabel = { whisper: 'Whisper', beep: 'Beep', none: 'Unreachable' };
    const messages = {
        1: [ { dir: 'in', text: 'Good morning ❀', time: '09:12' }, { dir: 'out', text: 'Morning! sleep well?', time: '09:10' } ],
        2: [ { dir: 'out', text: 'Hey, you around?', time: '08:47' } ],
    };

    // ============================ state ============================
    let activeIcon = 'chat';
    let notifTab = 'last';
    let historySort = 'new';
    let activeTags = [];
    let searchKeyword = '';
    let selectedContact = null;
    let selectedGroup = 'room';
    let layoutMode = 'split';   // 'split' | 'stacked'
    let stackedView = 'list';   // 'list' | 'detail' — only meaningful when stacked
    let lastConvKey = null;     // guards renderConv from rebuilding when nothing D-relevant changed

    function avatarInitials(name) { return name.slice(0, 2).toUpperCase(); }
    function presenceColorVar(p) { return { online: '--c-online', busy: '--c-busy', idle: '--c-idle', offline: '--c-offline' }[p]; }
    function makeAvatarHTML(name, presence, size) {
        const s = size || 32;
        return `<div class="fcm-avatar" style="width:${s}px;height:${s}px;">${avatarInitials(name)}${presence ? `<div class="fcm-presence" style="background:var(${presenceColorVar(presence)})"></div>` : ''}</div>`;
    }
    function capPillHTML(cap) {
        const colorVar = cap === 'none' ? '--c-text-dim' : `--c-${cap}`;
        return `<span class="fcm-cap-pill" style="background:var(${colorVar}); background:color-mix(in srgb, var(${colorVar}) 18%, transparent); color:var(${colorVar})">${capLabel[cap]}</span>`;
    }

    // ============================ titlebar: layout + maximize ============================
    document.getElementById('btn-close').addEventListener('click', () => alert('(mock) close'));
    document.getElementById('btn-maximize').addEventListener('click', (e) => {
        const maximized = document.getElementById('fcm-panel').classList.toggle('maximized');
        e.currentTarget.classList.toggle('active', maximized);
        document.getElementById('btn-maximize-label').textContent = maximized ? '還原' : '全版';
    });
    document.getElementById('btn-layout').addEventListener('click', (e) => {
        layoutMode = layoutMode === 'split' ? 'stacked' : 'split';
        stackedView = selectedContact ? 'detail' : 'list';
        e.currentTarget.classList.toggle('active', layoutMode === 'stacked');
        document.getElementById('btn-layout-label').textContent = layoutMode === 'stacked' ? '合併' : '分版';
        render();
    });

    // ============================ rail ============================
    document.querySelectorAll('#fcm-rail .fcm-icon').forEach(el => {
        el.addEventListener('click', () => {
            const icon = el.dataset.icon;
            if (icon === 'status') { toggleStatusMenu(el); return; }
            activeIcon = icon;
            if (layoutMode === 'stacked') stackedView = 'list';
            document.getElementById('fcm-profile').style.display = 'none';
            document.querySelectorAll('#fcm-rail .fcm-icon').forEach(i => i.classList.toggle('active', i === el));
            document.getElementById('rail-avatar').classList.remove('active');
            render();
        });
    });
    document.getElementById('rail-avatar').addEventListener('click', () => {
        document.querySelectorAll('#fcm-rail .fcm-icon').forEach(i => i.classList.remove('active'));
        document.getElementById('rail-avatar').classList.add('active');
        renderProfile();
    });

    function toggleStatusMenu(anchor) {
        const menu = document.getElementById('fcm-status-menu');
        if (menu.classList.contains('open')) { menu.classList.remove('open'); return; }
        menu.innerHTML = STATUS.map(s => `<div class="fcm-status-opt" data-status="${s.key}"><span class="dot" style="background:var(${presenceColorVar(s.key)})"></span>${s.label}</div>`).join('');
        const rect = anchor.getBoundingClientRect();
        const panelRect = document.getElementById('fcm-panel').getBoundingClientRect();
        menu.style.top = (rect.top - panelRect.top) + 'px';
        menu.classList.add('open');
        menu.querySelectorAll('.fcm-status-opt').forEach(opt => opt.addEventListener('click', () => { myStatus = opt.dataset.status; menu.classList.remove('open'); updateRailStatusDot(); }));
    }
    document.addEventListener('click', (e) => {
        const menu = document.getElementById('fcm-status-menu');
        if (menu.classList.contains('open') && !menu.contains(e.target) && e.target.closest('[data-icon="status"]') === null) menu.classList.remove('open');
    });
    function updateRailStatusDot() { document.getElementById('rail-status-dot').style.background = `var(${presenceColorVar(myStatus)})`; }

    // ============================ open a contact (shared by every list view) ============================
    function openContact(id) {
        selectedContact = id;
        if (layoutMode === 'stacked') stackedView = 'detail';
        render();
        const row = document.querySelector(`#fcm-list [data-open="${id}"]`);
        if (row) {
            row.classList.add('just-opened');
            row.addEventListener('animationend', () => row.classList.remove('just-opened'), { once: true });
        }
    }

    // ============================ C region renderers ============================
    function renderList() {
        const wrap = document.getElementById('fcm-list');
        document.getElementById('fcm-body').classList.toggle('stacked-mode', layoutMode === 'stacked');
        wrap.style.display = 'flex';
        wrap.classList.toggle('wide', layoutMode === 'stacked');
        // In stacked mode both C and D stay mounted; which one is "in front" is purely a
        // sliding transform, so the push-navigation animation has something to animate between.
        wrap.classList.toggle('fcm-slide-off', layoutMode === 'stacked' && stackedView === 'detail');
        if (activeIcon === 'notifications') return renderNotifications(wrap);
        if (activeIcon === 'chat') return renderChatList(wrap);
        if (activeIcon === 'groups') return renderQuickGroups(wrap);
        if (activeIcon === 'settings') return renderSettingsList(wrap);
        wrap.innerHTML = '<div class="fcm-empty">—</div>';
    }

    function renderNotifications(wrap) {
        wrap.innerHTML = `
            <div class="fcm-subtabs">
                <div class="fcm-subtab ${notifTab === 'last' ? 'active' : ''}" data-tab="last">最後聊天</div>
                <div class="fcm-subtab ${notifTab === 'history' ? 'active' : ''}" data-tab="history">歷史對話</div>
            </div>
            ${notifTab === 'history' ? `<div class="fcm-toolbar-row">
                <span class="fcm-mini-btn ${historySort === 'new' ? 'active' : ''}" data-sort="new">Newest</span>
                <span class="fcm-mini-btn ${historySort === 'old' ? 'active' : ''}" data-sort="old">Oldest</span>
                <span class="fcm-mini-btn" data-clear="1">Clear</span>
            </div>` : ''}
            <div class="fcm-scroll" id="fcm-list-scroll"></div>
        `;
        wrap.querySelectorAll('[data-tab]').forEach(el => el.addEventListener('click', () => { notifTab = el.dataset.tab; render(); }));
        wrap.querySelectorAll('[data-sort]').forEach(el => el.addEventListener('click', () => { historySort = el.dataset.sort; render(); }));
        const clearBtn = wrap.querySelector('[data-clear]');
        if (clearBtn) clearBtn.addEventListener('click', () => alert('(mock) history cleared'));

        const scroll = wrap.querySelector('#fcm-list-scroll');
        if (notifTab === 'last') {
            scroll.innerHTML = contacts.slice(0, 30).map(c => `
                <div class="fcm-row ${selectedContact === c.id ? 'selected' : ''}" data-open="${c.id}">
                    ${makeAvatarHTML(c.name, c.presence)}
                    <div class="fcm-row-meta"><div class="fcm-row-name">${c.name}</div><div class="fcm-row-sub">${c.last.dir === 'in' ? 'From' : 'To'} — ${c.last.text}</div></div>
                    <div class="fcm-row-time">${c.last.time}</div>
                </div>`).join('');
        } else {
            let log = historyLog.slice();
            if (historySort === 'old') log = log.slice().reverse();
            scroll.innerHTML = log.map(h => {
                const c = contacts.find(c => c.id === h.contactId);
                return `<div class="fcm-row" data-open="${c.id}">
                    ${makeAvatarHTML(c.name, c.presence)}
                    <div class="fcm-row-meta"><div class="fcm-row-name">${c.name}</div><div class="fcm-row-sub">${h.text}</div></div>
                    <div class="fcm-row-time">${h.time}</div>
                </div>`;
            }).join('');
        }
        scroll.querySelectorAll('[data-open]').forEach(el => el.addEventListener('click', () => openContact(Number(el.dataset.open))));
    }

    function renderChatList(wrap) {
        wrap.innerHTML = `
            <div class="fcm-search-wrap"><input class="fcm-search" id="chat-search" placeholder="Search people or messages…" value="${searchKeyword}"></div>
            <div class="fcm-tags" id="chat-tags"></div>
            <div class="fcm-scroll" id="fcm-list-scroll"></div>
        `;
        const tagsWrap = wrap.querySelector('#chat-tags');
        tagsWrap.innerHTML = tagDefs.map(t => `<div class="fcm-tag ${activeTags.includes(t.key) ? 'active' : ''}" data-tag="${t.key}">${t.label}</div>`).join('')
            + `<div class="fcm-tag-sep"></div>`
            + `<div class="fcm-tag ${activeTags.includes(OFFLINE_TAG.key) ? 'active' : ''}" data-tag="${OFFLINE_TAG.key}">${OFFLINE_TAG.label}</div>`;
        tagsWrap.querySelectorAll('[data-tag]').forEach(el => el.addEventListener('click', () => {
            const k = el.dataset.tag;
            activeTags = activeTags.includes(k) ? activeTags.filter(x => x !== k) : [...activeTags, k];
            render();
        }));
        wrap.querySelector('#chat-search').addEventListener('input', (e) => { searchKeyword = e.target.value; render(); });

        // Default (no tags picked) = every online friend. "未上線" is the one exclusive
        // switch that flips that base pool to offline friends instead; the relationship
        // tags (owner/sub/follow) then narrow whichever pool is active — they never change
        // which pool (online vs offline) you're looking at, only "未上線" does that.
        const wantOffline = activeTags.includes(OFFLINE_TAG.key);
        const relTags = activeTags.filter(t => t !== OFFLINE_TAG.key);
        let list = contacts.filter(c => wantOffline ? c.presence === 'offline' : c.presence !== 'offline');
        if (relTags.length) list = list.filter(c => c.tags.some(t => relTags.includes(t)));
        if (searchKeyword) list = list.filter(c => c.name.toLowerCase().includes(searchKeyword.toLowerCase()));
        const scroll = wrap.querySelector('#fcm-list-scroll');
        scroll.innerHTML = list.length ? list.map(c => `
            <div class="fcm-row ${selectedContact === c.id ? 'selected' : ''}" data-open="${c.id}">
                ${makeAvatarHTML(c.name, c.presence)}
                <div class="fcm-row-meta"><div class="fcm-row-name">${c.name}</div><div class="fcm-row-sub">${capPillHTML(c.cap)}</div></div>
            </div>`).join('') : '<div class="fcm-empty">No contacts in this view yet.</div>';
        scroll.querySelectorAll('[data-open]').forEach(el => el.addEventListener('click', () => openContact(Number(el.dataset.open))));
    }

    function renderQuickGroups(wrap) {
        wrap.innerHTML = `
            <div class="fcm-search-wrap"><input class="fcm-search" placeholder="Search groups…"></div>
            <div class="fcm-list-header">Groups</div>
            <div id="qg-groups" style="padding:0 6px 8px;"></div>
            <div class="fcm-list-header">Members</div>
            <div class="fcm-scroll" id="fcm-list-scroll"></div>
        `;
        const groupsWrap = wrap.querySelector('#qg-groups');
        groupsWrap.innerHTML = quickGroups.map(g => `<div class="fcm-row ${selectedGroup === g.id ? 'selected' : ''}" data-group="${g.id}"><div class="fcm-row-name">${g.builtin ? '📍 ' : ''}${g.label}</div></div>`).join('');
        groupsWrap.querySelectorAll('[data-group]').forEach(el => el.addEventListener('click', () => { selectedGroup = el.dataset.group; render(); }));

        const g = quickGroups.find(g => g.id === selectedGroup);
        const scroll = wrap.querySelector('#fcm-list-scroll');
        scroll.innerHTML = (g && g.members.length) ? g.members.map(c => `
            <div class="fcm-row ${selectedContact === c.id ? 'selected' : ''}" data-open="${c.id}">
                ${makeAvatarHTML(c.name, c.presence)}<div class="fcm-row-meta"><div class="fcm-row-name">${c.name}</div></div>
            </div>`).join('') : '<div class="fcm-empty">No members yet.</div>';
        scroll.querySelectorAll('[data-open]').forEach(el => el.addEventListener('click', () => openContact(Number(el.dataset.open))));
    }

    function renderSettingsList(wrap) {
        wrap.innerHTML = `<div class="fcm-list-header">Settings (placeholder)</div>
            <div class="fcm-scroll">
                <div class="fcm-row"><div class="fcm-row-name">Notification sound</div></div>
                <div class="fcm-row"><div class="fcm-row-name">Theme</div></div>
                <div class="fcm-row"><div class="fcm-row-name">Data & storage</div></div>
            </div>`;
    }

    // ============================ D region ============================
    function renderConv() {
        const conv = document.getElementById('fcm-conv');
        conv.style.display = 'flex';
        conv.classList.toggle('fcm-slide-in', layoutMode === 'stacked' && stackedView === 'detail');
        const c = contacts.find(c => c.id === selectedContact);
        const key = (c ? c.id : 'none') + '|' + layoutMode;
        if (key === lastConvKey) return; // nothing D-relevant changed — don't rebuild or re-animate
        lastConvKey = key;
        if (!c) { conv.innerHTML = '<div class="fcm-conv-empty">Select a contact to open the conversation.</div>'; return; }
        const msgs = messages[c.id] || [];
        const backBtn = layoutMode === 'stacked'
            ? `<button class="fcm-back-btn" id="fcm-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg></button>`
            : '';
        conv.innerHTML = `
            <div id="fcm-conv-header">
                ${backBtn}
                ${makeAvatarHTML(c.name, c.presence, 30)}
                <div class="fcm-conv-name">${c.name}</div>
                <div class="fcm-conv-room">${c.room || '—'}</div>
            </div>
            <div id="fcm-conv-body">
                ${msgs.length ? msgs.map(m => `<div class="fcm-msg ${m.dir}">${m.text}<span class="fcm-msg-time">${m.time}</span></div>`).join('') : '<div class="fcm-conv-empty">No messages yet.</div>'}
            </div>
            <div id="fcm-conv-actions">
                <div class="fcm-action-btn">Invite to room</div>
                <div class="fcm-action-btn">Delete message</div>
                <div class="fcm-action-btn">Save message</div>
            </div>
            <div id="fcm-conv-input-row">
                <textarea rows="2" placeholder="Messaging coming soon…" disabled></textarea>
                <button disabled>Send</button>
            </div>
        `;
        const back = conv.querySelector('#fcm-back');
        if (back) back.addEventListener('click', () => { stackedView = 'list'; render(); });
    }

    // ============================ profile editor ============================
    function renderProfile() {
        document.getElementById('fcm-list').style.display = 'none';
        document.getElementById('fcm-conv').style.display = 'none';
        const p = document.getElementById('fcm-profile');
        p.style.display = 'flex';
        p.innerHTML = `
            <div class="fcm-profile-row">
                <div class="fcm-profile-avatar">Me</div>
                <div>
                    <div class="fcm-field"><label>Avatar source</label>
                        <div class="fcm-avatar-source">
                            <button class="${me.avatarMode === 'game' ? 'active' : ''}" data-avatar-mode="game">In-game character</button>
                            <button class="${me.avatarMode === 'custom' ? 'active' : ''}" data-avatar-mode="custom">Custom URL</button>
                        </div>
                    </div>
                    <div class="fcm-field"><label>Avatar URL</label><input type="text" placeholder="https://…" value="${me.avatarUrl}"></div>
                </div>
            </div>
            <div class="fcm-field"><label>Display name</label><input type="text" value="${me.name}"></div>
            <div class="fcm-field"><label>Signature</label><textarea rows="2">${me.signature}</textarea></div>
            <div class="fcm-field"><label>Status</label>
                <div class="fcm-status-row">${STATUS.map(s => `<div class="fcm-status-choice ${myStatus === s.key ? 'active' : ''}" data-status="${s.key}"><span class="dot" style="background:var(${presenceColorVar(s.key)})"></span>${s.label}</div>`).join('')}</div>
            </div>
        `;
        p.querySelectorAll('[data-avatar-mode]').forEach(b => b.addEventListener('click', () => { me.avatarMode = b.dataset.avatarMode; renderProfile(); }));
        p.querySelectorAll('[data-status]').forEach(b => b.addEventListener('click', () => { myStatus = b.dataset.status; updateRailStatusDot(); renderProfile(); }));
    }

    function render() { renderList(); renderConv(); }

    // ============================ theme + corner switches ============================
    document.querySelectorAll('[data-theme-btn]').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('[data-theme-btn]').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('fcm-panel').setAttribute('data-theme', btn.dataset.themeBtn);
        });
    });
    updateRailStatusDot();
    render();
</script>
</body>
</html>
